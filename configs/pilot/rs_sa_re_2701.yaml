experiment:
  name: nasnet_rs_sa_re_pilot_2701
  method: RS-SA-RE
  mode: pilot
  search_seed: 2701
  output_dir: experiments/pilot/rs_sa_re_2701
  overwrite: false

dataset:
  name: CIFAR10
  data_root: data/cifar10
  split_dir: data/splits/nasnet_v041
  split_seed: 20260823
  train_size: 45000
  val_size: 5000
  official_test_size: 10000
  download: true
  augment_train: true
  num_workers: 4
  pin_memory: true

network:
  N: 3
  F: 24
  num_classes: 10

training:
  epochs: 5
  batch_size: 128
  optimizer: SGD
  learning_rate: 0.025
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: cosine
  gradient_clip_norm: 5.0
  amp: true
  training_seed_base: 20260827
  drop_path: false
  auxiliary_head: false
  torch_compile: false

evolution:
  population_size: 20
  tournament_size: 5
  budget: 30
  candidate_count: 5

surrogate:
  input_dim: 280
  hidden_dims: [32, 16]
  optimizer: Adam
  learning_rate: 0.001
  weight_decay: 0.0001
  steps: 200
  seed_offset: 900000

stability:
  repeat_seed: 1802701
  warmup_pairs: 4
  repeat_interval: 4
  repeat_rate_beta: 0.25
  lambda: 1.0  # Provisional pilot value; do not tune from one seed.

device:
  use_cuda: true
  cuda_index: 0
